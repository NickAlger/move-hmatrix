<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="H² keeps storage per unknown flat, but its Cholesky runs 11–12× slower than with H" font-size="11.5"><title>H² keeps storage per unknown flat, but its Cholesky runs 11–12× slower than with H</title><style>svg{--cds-bg:#ffffff;--cds-text-primary:#1f2328;--cds-text-secondary:#59636e;--cds-chart-axis:#818b98;--cds-chart-grid:#d8dee4;--cds-chart-muted:#8c959f;--cds-chart-categorical-1:#0969da;--cds-chart-reference:#bc4c00;--cds-chart-reference-tint:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,"Liberation Sans",sans-serif}@media (prefers-color-scheme:dark){svg{--cds-bg:#0d1117;--cds-text-primary:#e6edf3;--cds-text-secondary:#9198a1;--cds-chart-axis:#7d8590;--cds-chart-grid:#30363d;--cds-chart-muted:#7d8590;--cds-chart-categorical-1:#4493f8;--cds-chart-reference:#f0883e;--cds-chart-reference-tint:#161b22}}</style><rect x="0" y="0" width="760" height="340" rx="6" style="fill:var(--cds-bg)"/><text x="24" y="28" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">H² keeps storage per unknown flat, but its Cholesky runs 11–12× slower than with H</text><text x="24" y="48" style="fill:var(--cds-text-secondary)">3D Laplace single-layer BEM on a sphere · ACA and truncation at ε = 1e-4 · H² from compress_hmatrix_h2matrix</text><text x="24" y="64" style="fill:var(--cds-text-secondary)">H2Lib community branch · 2-core Xeon VM · reference BLAS · labels: H² ÷ H for time, H ÷ H² for storage</text><text x="64" y="92" font-size="13" style="fill:var(--cds-text-primary)">Cholesky factorization time (s, log scale)</text><text x="460" y="92" font-size="13" style="fill:var(--cds-text-primary)">Matrix storage per unknown (KiB)</text><g><g><line x1="64" x2="290" y1="273.40291991202446" y2="273.40291991202446" style="stroke:var(--cds-chart-grid)"></line><text x="56" y="277.40291991202446" text-anchor="end" style="fill:var(-